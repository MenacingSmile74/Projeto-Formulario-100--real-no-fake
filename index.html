<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Vamos comecar criando uma classe de estilo chamada container-->
    <main class ="container">
        <h1>Pesquisa de satifação</h1>
        <p class="subtitulo"> Leva menos de 2 minutos, campos com * sao de preenchimento obrigatorio.</p>

        <form id="formPesquisa" action="processar.php" method="post" novalidate>
            <!--Nome-->
            <div class="campo" data-campo="nome">
                <label for="name">Nome Completo*</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
                <span class="erro" id="erro-nome" aria-live="polite"></span>
            </div>

            <!--E-mail-->
            <div class="campo" data-campo="email">
                <label for="email">E-mail *</label>
                <input type="email" id="email" name="email" placeholder="exemplo@gmail.com">
                <span class="erro" id="erro-email" aria-live="polite"></span>

            </div>

            <!--Criando a div da idade-->
            <div class="campo" data-campo="idade">
                <label for="idade">Idade*</label>
                <input type="number" id="idade" name="idade" placeholder="19">
                <span class="erro" id="erro-idade" aria-live="polite"></span>

            </div>

            <!--Criando a div do estado-->
            <div class="campo" data-campo="estado">
                <label for="estado">Estado*</label>
                <select id="estado" nome="estado">
                    <option value="">Selecione o Estado</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapa</option>
                    <option value="AM">Amazonas</option>
                    <option value="PR">Parana</option>
                    <option value="SC">Santa Catarina</option>
                    <!--Comando para duplicar a linha é Shift + alt + setinha pra baixo-->
                    <!--Comando para duplicar a linha é Shift + alt + setinha pra baixo-->
                </select>
                <span class="erro" id="erro-estado" aria-live="polite"></span>
                
            </div>

            <!--Nota de avaliacao (radio)-->
            <fieldset class="campo" data-campo="nota">
                <legend>Qual a nota que vc da pra o curso</legend>
                <div class="opcoes-nota">
                    <label>
                        <input type="radio" name="nota" value="1">
                        <span>1</span>                    
                    </label>
                    <label>
                        <input type="radio" name="nota" value="2">
                        <span>2</span>
                    </label>
                    <label>
                        <input type="radio" name="nota" value="3">
                        <span>3</span>
                    </label>
                    <label>
                        <input type="radio" name="nota" value="4">
                        <span>4</span>
                    </label>
                    <label>
                        <input type="radio" name="nota" value="5">
                        <span>5</span>
                    </label>

                </div>

            </fieldset>
            
            <fieldset class="campo" data-campo="origem">
                <legend>Como vc conheceu o curso? *(marque pelo menos um)</legend>
                <label class="opcao">
                    <input type="checkbox" name="origem[]" value="indicacao">
                    Indicação de Amigos                   
                </label>
                <label class="opcao">
                    <input type="checkbox" name="origem[]" value="redes">
                    redes sociais
                </label>

                <label class="opcao">
                    <input type="checkbox" name="origem[]" value="busca-internet">
                    pesquisa na internet
                </label>
                 <label class="opcao">
                    <input type="checkbox" name="origem[]" value="outro">
                    outro
                </label>
                <span class="erro" id="erro-origem" aria-live="polite"></span>

            </fieldset>

            <!-- Comentario -->
             <div class="campo" data-campo="comentario">
                <label for="comentario">Comentario (opcional)</label>
                <textarea id="comentario" name="comentario" rows="4" maxlength="300" placeholder="Comente seu comentario">

                </textarea>
                <small class="contador">
                    <span id="contador">0</span>
                    /300 caracteres
                    
                </small>
                <span class="erro" id="erro-comentario" aria-live="polite"></span>
             </div>
             <!-- campo de aceite termos-->
              <div class="campo" data-campo="termos">
                <label class="opcao">
                    <input type="checkbox" id="termos" name="termos">
                    concordo ao enviar essas respostas
                </label>
                <span class="erro" id="erro-termos" aria-live="polite"></span>

              </div>

              <!--Criando o botao de enviar-->
              <button class="botao" type="submit">
                Enviar Pesquisa

              </button>
        </form>
    </main>

    <!-- Aqui vamos vincular o nosso arquivo javascript-->
     <script src="script.js"></script>
    </body>
</html>
